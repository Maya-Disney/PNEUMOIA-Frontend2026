server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Compression gzip
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Cache long pour les assets avec hash (js, css, wasm)
    location ~* \.(js|css|woff2?|ico|png|jpg|svg|wasm|mjs)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback : toutes les routes React Router → index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
